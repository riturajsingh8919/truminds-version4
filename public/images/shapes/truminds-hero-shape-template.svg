<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="970" viewBox="0 0 1200 970" fill="none">
  <title>Reusable Organic Hero Image Shape Template</title>
  <desc>Animation-ready SVG template. Replace href values with your images.</desc>

  <defs>
    <!-- Smooth Seamless Main Arch Path -->
    <path id="heroShape" d="
      M 60 520
      C 45 610 65 700 130 750
      C 195 800 270 765 340 700
      C 420 625 500 580 600 580
      C 700 580 780 625 860 700
      C 930 765 1005 800 1070 750
      C 1135 700 1155 610 1140 520
      C 1120 380 1060 250 950 160
      C 850 80 730 40 600 40
      C 470 40 350 80 250 160
      C 140 250 80 380 60 520 Z
    "/>

    <clipPath id="heroClip" clipPathUnits="userSpaceOnUse">
      <use href="#heroShape"/>
    </clipPath>

    <clipPath id="circleClip" clipPathUnits="userSpaceOnUse">
      <circle cx="600" cy="660" r="250"/>
    </clipPath>

    <linearGradient id="heroBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0068a5"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#001833" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#001833" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- BLUE ACCENT WING -->
  <g id="blue-accent" transform="translate(18, 14)">
    <use href="#heroShape" fill="url(#heroBlueGrad)"/>
  </g>

  <!-- MAIN PHOTO LAYER -->
  <g id="main-image-layer" filter="url(#softShadow)">
    <use href="#heroShape" fill="#ffffff"/>
    <g clip-path="url(#heroClip)">
      <image id="main-photo"
             href="/images/about/about-parallax-team.jpg"
             x="-50" y="-40" width="1300" height="1050"
             preserveAspectRatio="xMidYMid slice"/>
    </g>
  </g>

  <!-- FOREGROUND CIRCLE PHOTO & FRAME -->
  <g id="circle-group" filter="url(#softShadow)">
    <circle cx="600" cy="660" r="266" fill="#ffffff"/>
    <g clip-path="url(#circleClip)">
      <image id="circle-photo"
             href="/images/about/about-parallax-team.jpg"
             x="260" y="320" width="680" height="680"
             preserveAspectRatio="xMidYMid slice"/>
    </g>
    <circle id="circle-border" cx="600" cy="660" r="258" fill="none" stroke="#ffffff" stroke-width="16"/>
  </g>
</svg>
